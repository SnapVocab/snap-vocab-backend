server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name api.snapvocab.thanhthbm.online;

    ssl_certificate /etc/letsencrypt/live/api.snapvocab.thanhthbm.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.snapvocab.thanhthbm.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;
    access_log /var/log/nginx/snapvocab-api.access.log;
    error_log /var/log/nginx/snapvocab-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.snapvocab.thanhthbm.online;
    return 301 https://api.snapvocab.thanhthbm.online$request_uri;
}
