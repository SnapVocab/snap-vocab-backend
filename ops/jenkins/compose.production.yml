services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thanhthbm/snapvocab-backend:${IMAGE_TAG:?IMAGE_TAG is required}}
    container_name: snapvocab-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/snapvocab/.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "8080"
