# Local-only test profile. Integration tests must run against a LOCAL MySQL/MariaDB instance;
# LocalDatabaseGuard aborts the context before any connection if the JDBC host is not local.
# Override credentials with SNAPVOCAB_TEST_DB_URL / _USERNAME / _PASSWORD if your local setup differs.
spring:
  datasource:
    url: ${SNAPVOCAB_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/snapvocab_it?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SNAPVOCAB_TEST_DB_USERNAME:root}
    password: ${SNAPVOCAB_TEST_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
  mail:
    host: 127.0.0.1
    port: 2525
    username: test
    password: test
    open-in-view: false

snapvocab:
  semantic-binding:
    fork-mode: REPORT

# Test-only placeholders so the full application context can be built locally (SnapvocabApplicationTests).
# Not real credentials; the MinIO endpoint is local and unused by the JPA slice tests.
jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1mb3ItbG9jYWwtc3ByaW5nLWNvbnRleHQtdGVzdHMtMDEyMzQ1Njc4OS02NGJ5dGVzIQ==
  access-expiration: 900 # seconds (15 min)
  refresh-expiration: 604800 # seconds (7 days)

minio:
  endpoint: http://127.0.0.1:9000
  access-key: test
  secret-key: test-secret
  bucket: snapvocab-test

# The leaderboard job never fires during a test run; tests call refresh()/get() themselves.
leaderboard:
  refresh-interval-ms: 3600000
