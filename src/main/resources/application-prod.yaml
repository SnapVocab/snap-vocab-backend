server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://prod-db:3306/snapvocab
    username: prod_user
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

logging:
  level:
    root: INFO

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

minio:
  endpoint: endpoint_here
  access-key: access-key here
  secret-key: secret-key here
  bucket: snapvocab

ai-service:
  base-url: ${AI_SERVICE_URL}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000

