server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      # REL-DM-01: schema changes go through migration/*.sql; startup fails on drift instead of patching it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900 # seconds (15 min)
  refresh-expiration: 604800 # seconds (7 days)

minio:
  internal-endpoint: ${MINIO_INTERNAL_ENDPOINT:}
  region: ${MINIO_REGION:us-east-1}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:}
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:snapvocab}

ai-service:
  base-url: ${AI_SERVICE_URL}
  connect-timeout-ms: 5000
  # Keep the same timeout as dev; override for the deployed GPU through environment.
  read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:120000}
  service-token: ${AI_SERVICE_TOKEN:}
  # Only for a RunPod Serverless endpoint: a Restricted key limited to that endpoint.
  api-key: ${RUNPOD_API_KEY:}
  # Extra attempts while a Serverless worker boots. Keep read-timeout-ms above RunPod's 2 min "no worker" limit then.
  cold-start-retries: ${AI_SERVICE_COLD_START_RETRIES:0}
  max-upload-mb: 10
