spring:
  application:
    name: snapvocab

  profiles:
    active: dev

# Scan-to-vocabulary (BF-06). See ScanProperties for what each knob does.
scan:
  quota-per-day: 20
  zone: Asia/Ho_Chi_Minh
  workers: 1
  queue-capacity: 3
  stale-margin-seconds: 30
  min-reliability: LOW

# Weekly XP leaderboard (docs/sa/leaderboard_backend.md §5.6).
# Calibration knob: raise it if the refresh query gets slow (§10.3).
leaderboard:
  refresh-interval-ms: 60000

# Notifications (docs/decisions/notification.md §4.4). J1 stays off until the app ships push (DEP-NOTIF-02);
# turn it on per environment. EXPO_ACCESS_TOKEN only when "Enhanced push security" is on in EAS.
# Daily Mission ops alert (daily_mission.md §12): mail on MISSION_POOL_INSUFFICIENT, at most hourly. Blank = log only.
mission:
  alert-email: ${MISSION_ALERT_EMAIL:}

notification:
  srs-reminder:
    enabled: ${NOTIFICATION_SRS_REMINDER_ENABLED:false}
  push:
    url: https://exp.host/--/api/v2/push/send
    access-token: ${EXPO_ACCESS_TOKEN:}
    backoff-ms: 2000,8000,30000

webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:SnapVocab}
  allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  challenge-ttl-seconds: ${WEBAUTHN_CHALLENGE_TTL_SECONDS:300}
  timeout-ms: ${WEBAUTHN_TIMEOUT_MS:60000}
  require-user-verification: ${WEBAUTHN_REQUIRE_USER_VERIFICATION:true}
  android-package: ${WEBAUTHN_ANDROID_PACKAGE:com.snapvocab}
  android-sha256-fingerprints: ${WEBAUTHN_ANDROID_SHA256_FINGERPRINTS:}
  ios-app-id: ${WEBAUTHN_IOS_APP_ID:}
